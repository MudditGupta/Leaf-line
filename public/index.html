<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leafline</title>
<meta name="description" content="Snap a plant, learn how to keep it alive.">
<meta name="theme-color" content="#1E6B4C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column (max 480px); immersive full-bleed screens for scan + result; bottom tab bar on list screens */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --sunk:#E3E9E2; --ink:#13201A; --muted:#55655B; --line:#DCE3DC;
  --accent:#1E6B4C; --accent-ink:#FFFFFF; --accent-soft:#D6E8DD;
  --sun:#F4C95D; --sun-soft:#FBEFD2; --sun-deep:#8A6100; --night:#13201A; --night-ink:#EEF2EC; --night-muted:#A9B8AE;
  --bad:#A63A28; --bad-soft:#F7DDD7; --water:#3A7CA5; --water-soft:#DCEAF2;
  --display:"Bricolage Grotesque", "Avenir Next", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 1px 2px rgba(19,32,26,.06), 0 8px 24px rgba(19,32,26,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#17201B; --sunk:#1F2A24; --ink:#E6EEE8; --muted:#98A89E; --line:#27332C;
  --accent:#5CC08F; --accent-ink:#08140E; --accent-soft:#1D3A2C;
  --sun:#F4C95D; --sun-soft:#3A2F12; --sun-deep:#F4C95D; --night:#1F2A24; --night-ink:#E6EEE8; --night-muted:#A9B8AE;
  --bad:#F09A88; --bad-soft:#3A1E19; --water:#7FB8DB; --water-soft:#1B2E3A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#17201B; --sunk:#1F2A24; --ink:#E6EEE8; --muted:#98A89E; --line:#27332C;
  --accent:#5CC08F; --accent-ink:#08140E; --accent-soft:#1D3A2C;
  --sun:#F4C95D; --sun-soft:#3A2F12; --sun-deep:#F4C95D; --night:#1F2A24; --night-ink:#E6EEE8; --night-muted:#A9B8AE;
  --bad:#F09A88; --bad-soft:#3A1E19; --water:#7FB8DB; --water-soft:#1B2E3A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance;line-height:1.08}
p{margin:0}

.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:22px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;width:100%;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.light{background:var(--night-ink);color:var(--night)}
.round{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none;color:var(--ink)}
.round.glass{background:rgba(14,20,17,.55);color:#fff;box-shadow:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* home */
.hello h1{font-size:34px;font-weight:800}
.today{background:var(--night);color:var(--night-ink);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:18px}
.today .lab{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--sun)}
.today h2{font-size:26px;font-weight:800;margin-top:4px}
.today .sub{color:var(--night-muted);font-size:14px;margin-top:4px}
.today .drop{width:56px;height:56px;border-radius:50%;background:var(--sun);color:#13201A;display:grid;place-items:center;flex:none}
.faces{display:flex}
.faces span{width:36px;height:36px;border-radius:50%;border:2px solid var(--night);margin-left:-8px;overflow:hidden;display:grid;place-items:end center}
.faces span:first-child{margin-left:0}
.faces img{width:100%;height:100%;object-fit:cover}
.faces svg{width:90%;height:auto}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:0;border-radius:22px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);width:100%;color:var(--ink)}
.card .pic{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;display:grid;place-items:end center}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .pic svg{width:72%;height:auto}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:#FFFFFF;color:#13201A}
.badge.due{background:var(--sun);color:#3a2c00}
.card .nm{font-weight:800;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .lc{font-size:12px;color:var(--muted)}
.meter{height:5px;border-radius:5px;background:var(--water-soft);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--water);border-radius:5px}
.card .info{padding:0 6px 6px}
.empty{background:var(--surface);border-radius:24px;padding:32px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.ex{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}

/* welcome */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.hero-card{background:#13201A;color:#EEF2EC;border-radius:32px;padding:20px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.hero-art{position:relative;height:250px;border-radius:22px;background:#1B2A21;display:grid;place-items:center;overflow:hidden}
.hero-art>svg{width:230px;height:auto;margin-top:40px}
.tag{position:absolute;display:inline-flex;align-items:center;gap:6px;background:#EEF2EC;color:#13201A;font-size:12px;font-weight:800;padding:7px 11px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.tag svg{width:15px;height:15px}
.t1{top:22px;left:16px}.t2{top:92px;right:14px}.t3{bottom:22px;left:28px;background:#F4C95D}
.hero-copy h1{font-size:34px;font-weight:800;color:#FFFFFF}
.hero-copy p{color:#A9B8AE;margin-top:10px;font-size:15px}
.sunbtn{background:#F4C95D;color:#13201A}
.how{display:flex;flex-direction:column;gap:10px}
.howi{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.howi .n{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.howi b{display:block;font-size:15px}.howi small{color:var(--muted);font-size:13px}

.acct{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.acct.col{flex-direction:column;align-items:stretch;gap:12px}
.acct .am{flex:1;min-width:0}.acct .am b{display:block}.acct .am small{color:var(--muted);font-size:13px;word-break:break-all}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.sm{width:44px;height:44px;font-size:16px}
.gbtn{background:#FFFFFF;color:#1F1F1F;border:1px solid #DADCE0}
.eform{display:flex;flex-direction:column;gap:10px}
.eform input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.linkish{background:none;border:0;color:var(--accent);font-weight:800;padding:6px 0;font-size:inherit}
.err2{color:var(--bad);font-size:14px;margin:0}.ok2{color:var(--accent);font-size:14px;margin:0}
.wx{background:linear-gradient(160deg,#DCEAF2,#EEF2EC);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;color:#13201A}
.wxtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wxtop b{font-family:var(--display);font-size:34px;font-weight:800;margin-right:8px}.wxtop span{font-weight:800}.wxtop small{color:#3D4D43;font-weight:600}
.wxa{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.7);border-radius:16px;padding:10px 12px}
.wxa .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:#fff}
.wxa.warn .ic{color:#8A6100}.wxa.bad .ic{color:#3A7CA5}.wxa.ok .ic{color:#1E6B4C}
.wxa>div{flex:1;min-width:0}.wxa b{font-size:14px}.wxa p{font-size:13px;color:#3D4D43}
.wxa .chip{background:#13201A;color:#fff;border:0;height:34px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wx{background:linear-gradient(160deg,#1B2E3A,#17201B);color:#E6EEE8}
 :root:not([data-theme="light"]) .wxa{background:rgba(255,255,255,.06)} :root:not([data-theme="light"]) .wxa p,:root:not([data-theme="light"]) .wxtop small{color:#A9B8AE}
 :root:not([data-theme="light"]) .wxa .ic{background:#1F2A24}}
.ni.sun{background:#F4C95D;color:#13201A}
.jbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.jb{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:800;cursor:pointer;position:relative}
.jb svg{color:var(--accent);width:20px;height:20px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.tl{background:var(--surface);border-radius:20px;padding:6px 8px 6px 12px;box-shadow:var(--shadow)}
.tl::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:2px;background:var(--line)}
.tl li{display:flex;gap:12px;align-items:center;padding:6px 0;position:relative}
.tdot{width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent);z-index:1}
.tdot svg{width:15px;height:15px}
.tl li.warn .tdot{border-color:#F4C95D;color:var(--sun-deep)}.tl li.bad .tdot{border-color:var(--bad);color:var(--bad)}.tl li.ok .tdot{border-color:var(--accent)}
.tm{flex:1;min-width:0}.trow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.tm b{font-size:14px}.tm p{font-size:13px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tm small{color:var(--muted);font-size:12px;white-space:nowrap}
.xn{display:inline-block;font-size:11px;font-weight:800;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.tdel{width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:50%;display:grid;place-items:center;flex:none;opacity:.55}
.tdel:hover,.tdel:focus-visible{opacity:1;background:var(--sunk)}.tdel svg{width:14px;height:14px}
.tl img{width:52px!important;height:52px!important}
.tl img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.whatsnew{background:var(--night);color:var(--night-ink);border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.whatsnew .pill{background:var(--sun);color:#13201A;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.whatsnew>b{font-family:var(--display);font-size:20px}
.whatsnew ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.whatsnew li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--night-muted)}.whatsnew li b{color:var(--night-ink)}
.whatsnew li svg{color:var(--sun);flex:none;width:18px;height:18px}.whatsnew .tdel{color:var(--night-muted)}
.jsum{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.jst{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.jst b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.jst b small{font-size:14px;color:var(--muted)}
.jst span{font-size:11px;font-weight:700;color:var(--muted);line-height:1.25}
.jst.warn b{color:var(--sun-deep)}.jst.bad b{color:var(--bad)}.jst.ok b{color:var(--accent)}
.jst .bar{display:block;height:5px;border-radius:5px;background:var(--water-soft);margin-top:6px;overflow:hidden}.jst .bar i{display:block;height:100%;background:var(--water)}
.aisum{display:flex;flex-direction:column;gap:6px}
.aisum p{background:var(--accent-soft);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:14px;line-height:1.5}
.aisum .btn svg{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.st b{display:block;font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.st span{font-size:12px;font-weight:700;color:var(--muted)}.st.warn b{color:var(--sun-deep)}.st.bad b{color:var(--bad)}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;font-size:13px;font-weight:800;text-decoration:none;text-align:center;padding:8px}
.qb svg{color:var(--accent)}.qb.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.qb.primary svg{color:var(--accent-ink)}
.todo{background:var(--night);color:var(--night-ink);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px}
.todo .lab{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--sun)}
.todo h2{font-size:24px;font-weight:800}.todo .sub{color:var(--night-muted);font-size:14px}
.todo .drop{width:44px;height:44px;border-radius:50%;background:var(--sun);color:#13201A;display:grid;place-items:center}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:16px;padding:8px}
.tasks .th,.rowp .th{width:42px;height:42px;border-radius:12px;overflow:hidden;display:grid;place-items:end center;flex:none}
.tasks .th img,.rowp .th img{width:100%;height:100%;object-fit:cover}.tasks .th svg,.rowp .th svg{width:80%;height:auto}
.tx{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;padding:0}
.tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx small{color:var(--night-muted);font-size:12px}.tx em{color:var(--sun);font-style:normal;font-weight:700}
.todo .check{border-color:rgba(255,255,255,.25);color:var(--night-ink)}
.check.feed{color:var(--sun-deep)}.todo .check.feed{color:var(--sun)}
.check.done{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.08);transition:.2s}
.linkish.light{color:var(--sun)}
.rowsl{display:flex;flex-direction:column;gap:8px}
.rowp{display:flex;align-items:center;gap:12px;background:var(--surface);border:0;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;color:var(--ink);width:100%}
.rowp .m{flex:1;min-width:0}.rowp .m b{display:block;font-size:15px}.rowp .m small{color:var(--muted);font-size:13px}
.rowp .r{display:flex;align-items:center;gap:8px;color:var(--muted)}
.badge2{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--sunk);white-space:nowrap}.badge2.due{background:var(--sun);color:#3a2c00}
.dot{width:10px;height:10px;border-radius:50%}.dot.warn{background:#E2A72E}.dot.bad{background:var(--bad)}
.card.attn{outline:2px solid #E2A72E;outline-offset:-2px}
.qty{position:absolute;bottom:8px;right:8px;background:#13201A;color:#fff;font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px}
.hdot{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#F4C95D;color:#3a2c00}.hdot.bad{background:var(--bad);color:#fff}.hdot svg{width:15px;height:15px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd small{font-size:11px;font-weight:700;color:var(--muted)}.wd b{font-size:18px;font-family:var(--display)}
.wd i{height:16px;display:grid;place-items:center}.wd i span{font-style:normal;font-size:10px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px}
.wd[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}.wd[aria-selected="true"] small{color:var(--bg);opacity:.7}
.wd[aria-selected="true"] i span{background:var(--sun);color:#13201A}
.kind{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--water-soft);color:var(--water)}.kind.feed{background:var(--sun-soft);color:var(--sun-deep)}
.empty.sm{padding:22px}
.langbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px}
.whos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.who{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.who .wi{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.who b{font-size:13px}.who small{font-size:11px;color:var(--muted);line-height:1.3}
.who[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}.who[aria-pressed="true"] .wi{background:var(--accent);color:var(--accent-ink)}
.nudge{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:18px;padding:12px 14px}
.nudge .ni{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nudge>span:nth-child(2){flex:1;min-width:0}.nudge b{display:block;font-size:15px}.nudge small{color:var(--muted);font-size:13px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.act{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink)}
.act svg{color:var(--accent)}.act.on{background:var(--accent-soft)}
.btn.iconly{width:52px;padding:0;flex:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px}
.toggle b{display:block}.toggle small{color:var(--muted)}
.toggle i{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-checked="true"] i{background:var(--accent)}.toggle[aria-checked="true"] i::after{transform:translateX(20px)}

/* scan */
.cam{position:fixed;inset:0;background:#0B110E;color:#fff;display:flex;flex-direction:column;z-index:5}
.cam .view{position:relative;flex:1;overflow:hidden;display:grid;place-items:center}
.cam .view>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .bg-leaf{position:absolute;inset:0;display:grid;place-items:center}
.cam .top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:center;z-index:2}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(14,20,17,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{height:36px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:#fff;font-size:13px;font-weight:800}
.seg button.on{background:#fff;color:#13201A}
.frame{position:relative;width:min(72vw,300px);aspect-ratio:5/6;z-index:1}
.frame i{position:absolute;width:46px;height:46px;border:4px solid #F4C95D}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:24px}
.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:24px}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:24px}
.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:24px}
.hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(14,20,17,.7);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;z-index:2}
.hint b{width:8px;height:8px;border-radius:50%;background:#7FD4A4}
.cam .bar{padding-top:18px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;background:#0B110E}
.ctrls{width:100%;max-width:340px;display:flex;align-items:flex-end;justify-content:space-between}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;cursor:pointer;position:relative}
.shutter span{width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .15s}
.shutter:active span{transform:scale(.9)}
.side{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#1F2A24;cursor:pointer;color:#fff;position:relative;border:0}
.fileinput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.cam .note{font-size:13px;color:#A9B8AE;text-align:center}
.cam .err{width:100%;max-width:440px;background:#3A1E19;color:#F7C8BE;border-radius:14px;padding:12px 14px;font-size:14px}

.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0B110E}
.camstate{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:300px;padding:0 20px}
.camstate b{font-size:18px}.camstate span{color:#A9B8AE;font-size:14px}
.camstate .bigic.sun{background:#F4C95D;color:#13201A;width:76px;height:76px;border-radius:24px;margin-bottom:6px}
.camstate.idle b{font-size:22px;font-family:var(--display)}
.camstate strong{color:#fff}
.camstate .bigic{width:64px;height:64px;border-radius:20px;background:#1F2A24;display:grid;place-items:center;color:#fff}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #2E3B33;border-top-color:#5CC08F;animation:spin .8s linear infinite}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#D3DDD6;background:none;border:0;padding:0;cursor:pointer;width:96px;position:relative}
.ctl .side{margin:0}
.shutter.hc{border-color:#F4C95D}.shutter.hc span{background:#F4C95D}
.errbtn{margin-left:8px;background:#F7C8BE;color:#3A1E19;border:0;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px}
/* analyzing */
.scanline{position:absolute;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(127,212,164,0) 0%,rgba(127,212,164,.35) 85%,rgba(127,212,164,.9) 100%);animation:sweep 2.2s ease-in-out infinite;z-index:1}
@keyframes sweep{0%{top:-120px}100%{top:100%}}
.steps{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;padding:6px 0 10px}
.step{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;color:#6B7C71}
.step .dot{width:24px;height:24px;border-radius:50%;border:2px solid #2E3B33;display:grid;place-items:center;flex:none}
.step.done{color:#E6EEE8}.step.done .dot{background:#5CC08F;border-color:#5CC08F;color:#08140E}
.step.now{color:#fff}.step.now .dot{border-color:#5CC08F;border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.scanline,.step.now .dot{animation:none}}

/* result + detail */
.hero{position:relative;height:380px;margin:0 auto;max-width:480px;overflow:hidden;background:var(--sunk)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .ill{width:100%;height:100%;display:grid;place-items:end center}
.hero .ill svg{width:62%;height:auto}
.hero .top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between}
.sheet{position:relative;margin-top:-36px;background:var(--bg);border-radius:30px 30px 0 0;padding-top:26px;display:flex;flex-direction:column;gap:22px;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.title h1{font-size:36px;font-weight:800}
.sci{font-style:italic;color:var(--muted);margin-top:4px}
.match{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.match.low{background:var(--bad-soft);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.tile .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.tile .k{font-size:12px;font-weight:700;color:var(--muted)}
.tile .v{font-weight:800;font-size:15px;line-height:1.25}
.health{border-radius:20px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.health.ok{background:var(--accent-soft)}.health.ok .hic{color:var(--accent)}
.health.warn{background:var(--sun-soft)}.health.warn .hic{color:var(--sun-deep)}
.health.bad{background:var(--bad-soft)}.health.bad .hic{color:var(--bad)}
.health b{display:block;font-size:15px}
.health p{font-size:14px;margin-top:2px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:20px;font-weight:800}
.rows{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.rowi:last-child{border-bottom:0}
.rowi .ic{width:32px;height:32px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--muted)}
.rowi .k{font-size:14px;color:var(--muted);flex:1}
.rowi .v{font-size:14px;font-weight:700;text-align:right;max-width:58%}
.tips{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.tips li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.tips li span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.tips.warn li span{background:var(--bad-soft);color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.dock .btn.soft{width:auto;flex:none}

.verdict{border-radius:22px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;position:relative}
.verdict.ok{background:var(--accent-soft)}.verdict.ok .hic{color:var(--accent)}
.verdict.warn{background:var(--sun-soft)}.verdict.warn .hic{color:var(--sun-deep)}
.verdict.bad{background:var(--bad-soft)}.verdict.bad .hic{color:var(--bad)}
.verdict>div{flex:1;min-width:0}.verdict b{display:block;font-size:17px}.verdict p{font-size:15px;margin-top:4px}
.urg{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--ink)}
.roompill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800}
.roompill span{color:var(--accent);font-weight:800;margin-left:2px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.5);z-index:20;animation:fade .2s}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:28px 28px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out;max-height:90vh;overflow:auto}
.modal .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);align-self:center}
.modal h2{font-size:24px;font-weight:800}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:13px;font-weight:800;color:var(--muted)}
.field input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip.dashed{border-style:dashed;display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.modal,.scrim{animation:none}}
/* detail */
.waterbox{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .c b{font-family:var(--display);font-size:28px;font-weight:800}
.ring .c small{font-size:11px;color:var(--muted);font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--sunk);font-size:20px;font-weight:700}
.stepper output{font-weight:800;font-variant-numeric:tabular-nums}
.ask{display:flex;gap:8px;background:var(--surface);border-radius:999px;padding:6px;box-shadow:var(--shadow);margin:0}
.ask input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:0 12px;outline:none}
.ask button{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.bubble{background:var(--accent-soft);border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:15px;white-space:pre-wrap}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--bad);font-weight:700;padding:12px;align-self:center}

/* schedule */
.day{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.task .th{width:46px;height:46px;border-radius:12px;overflow:hidden;display:grid;place-items:end center;flex:none;border:0;padding:0}
.task .th img{width:100%;height:100%;object-fit:cover}
.task .th svg{width:80%;height:auto}
.task .m{flex:1;min-width:0}
.task .m b{display:block;font-size:15px}
.task .m small{color:var(--muted);font-size:13px}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--accent);flex:none}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}
.tab{border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;min-height:44px}
.tab[aria-current="true"]{color:var(--accent)}
.fab{justify-self:center;width:66px;height:66px;border-radius:50%;border:5px solid var(--bg);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-40px;box-shadow:0 10px 24px rgba(30,107,76,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:9;box-shadow:var(--shadow);white-space:nowrap}

/* ---------- tablet & desktop ---------- */
@media (min-width:860px){
  body{font-size:16px}
  .app{max-width:1120px}
  .screen{padding-top:40px;gap:28px}
  .hello h1{font-size:44px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .today{flex-direction:row;align-items:center;justify-content:space-between;padding:28px 32px}
  .today>.between:first-child{flex:1}
  .today h2{font-size:32px}
  .nudge{max-width:560px}
  .welcome{display:grid;grid-template-columns:1.15fr 1fr;column-gap:40px;align-items:start}
  .welcome>.between{grid-column:1/-1}
  .welcome>.sec{grid-column:2;grid-row:2}
  .welcome>.hero-card{grid-column:1;grid-row:2/span 3;flex-direction:row;flex-wrap:wrap}
  .welcome>.hero-card .hero-art{flex:1 1 100%;height:340px}
  .welcome>.how{grid-column:2;grid-row:3}
  .welcome>p{grid-column:2;grid-row:4;text-align:left!important}
  .hero-copy h1{font-size:44px}
  .tabs .in{max-width:520px}
  /* result + plant page: photo left, details right */
  .app:has(>.hero){max-width:none}
  .hero{position:fixed;left:0;top:0;bottom:0;width:44vw;max-width:none;height:auto;margin:0}
  .sheet{margin:0 0 0 44vw;border-radius:0;padding-top:48px;padding-left:56px;padding-right:56px;max-width:760px;min-height:100vh}
  .dock{left:44vw}
  .dock .in{max-width:648px;margin:0 0 0 56px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .title h1{font-size:48px}
  /* camera: centred viewfinder */
  .cam .view{max-width:none}
  .ctrls{max-width:420px}
  /* sheets become centred dialogs */
  .modal{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);border-radius:28px;padding-top:20px;animation:fade .2s}
  .modal .grab{display:none}
  .toast{bottom:110px}
}
@media (min-width:1280px){.hero{width:48vw}.sheet,.dock{margin-left:48vw}.dock{left:48vw}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs pad" id="tabs" aria-label="Main">
  <div class="in">
    <button class="tab" data-go="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14Z"/><path d="M5 19 13 11"/></svg>Plants</button>
    <button class="fab" data-go="scan" aria-label="Scan a plant"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg></button>
    <button class="tab" data-go="schedule"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Schedule</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- icons + illustrations ---------- */
const sv=(d,w=20,sw=2)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  back:sv('<path d="M15 5l-7 7 7 7"/>',20,2.2), close:sv('<path d="M6 6l12 12M18 6 6 18"/>',20,2.2),
  drop:sv('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/>',22),
  sun:sv('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  hum:sv('<path d="M7 4s3 3.3 3 5.5a3 3 0 0 1-6 0C4 7.3 7 4 7 4ZM16 9s4 4.4 4 7.3a4 4 0 0 1-8 0C12 13.4 16 9 16 9Z"/>'),
  temp:sv('<path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0Z"/>'),
  soil:sv('<path d="M5 10h14l-2 10H7L5 10Z"/><path d="M12 10V4M9 6l3-2 3 2"/>',18),
  feed:sv('<path d="M7 3h10l-1 5H8L7 3Z"/><path d="M8 8l-2 13h12L16 8"/>',18),
  paw:sv('<circle cx="7" cy="9" r="1.8"/><circle cx="17" cy="9" r="1.8"/><circle cx="10" cy="5" r="1.8"/><circle cx="14" cy="5" r="1.8"/><path d="M8 17c0-3 2-5 4-5s4 2 4 5c0 2-2 2-4 2s-4 0-4-2Z"/>',18),
  level:sv('<path d="M6 20V14M12 20V9M18 20V4"/>',18),
  calendar:sv('<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',18),
  check:sv('<path d="M5 12l5 5L19 7"/>',16,3),
  ok:sv('<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',22,2.2),
  alert:sv('<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17v.5"/>',22,2.2),
  send:sv('<path d="M5 12h14M13 6l6 6-6 6"/>',20,2.2),

  return (prof+lang).trim()?`${prompt}\n\n${(prof+lang).trim()}`:prompt;
}

let geo=null;try{geo=JSON.parse(localStorage.getItem("leafline.geo")||"null")}catch(e){}
const WXC=c=>c===0?"Clear":c<=3?"Partly cloudy":c<=48?"Foggy":c<=67?"Rain":c<=77?"Cold":c<=82?"Showers":"Thunderstorms";
async function loadWeather(force){
  if(!geo||window.claude)return;if(!force&&wx&&Date.now()-wx.at<3600e3&&wx.lat===geo.lat)return;
  try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&past_days=1&forecast_days=2&timezone=auto`;
    const j=await (await fetch(u)).json();if(!j.daily)return;
    wx={at:Date.now(),lat:geo.lat,t:Math.round(j.current.temperature_2m),h:j.current.relative_humidity_2m,code:j.current.weather_code,d:j.daily};
    setLS("leafline.wx",JSON.stringify(wx));if(view==="home"&&!sheet)render(true);

}
function askLocation(){
  if(!navigator.geolocation){toast("Location isn't available on this browser");return}
  navigator.geolocation.getCurrentPosition(pos=>{geo={lat:+pos.coords.latitude.toFixed(2),lon:+pos.coords.longitude.toFixed(2)};setLS("leafline.geo",JSON.stringify(geo));track("weather_on");loadWeather(true);toast("Weather-smart care is on")},
    ()=>toast("Location blocked. Allow it in browser settings to get weather tips."),{timeout:10000,maximumAge:3600e3});
}
function wxAdvice(){
  if(!wx)return[];const d=wx.d,out=[],ys=d.precipitation_sum[0]||0,ts=d.precipitation_sum[1]||0,tp=d.precipitation_probability_max[1]||0,tmax=d.temperature_2m_max[1],tmin=d.temperature_2m_min[1],wind=Math.max(d.wind_speed_10m_max[1]||0,d.wind_speed_10m_max[2]||0),rainTom=d.precipitation_probability_max[2]||0;
  const outDue=plants.filter(p=>isOutdoor(p)&&due(p)<=1),it=outDue.length===1?outDue[0].name:`${outDue.length} outdoor ${V().items}`;
  if(ys>=5&&outDue.length)out.push({k:"bad",ic:"drop",t:`${Math.round(ys)} mm rain yesterday`,s:`${it} got watered by the rain. Skip watering today.`,act:"rainskip"});
  else if(tp>=70&&ts>=4&&outDue.length)out.push({k:"warn",ic:"drop",t:`Rain likely today (${tp}%)`,s:`Hold off watering ${it}. The rain should cover it.`,act:"rainskip"});
  if(tmax>=36)out.push({k:"warn",ic:"temp",t:`Hot day, up to ${Math.round(tmax)}°C`,s:"Water outdoor pots early morning or evening. Small pots dry out fastest.",act:outDue.length?null:null});
  if(tmin<=6)out.push({k:"warn",ic:"temp",t:`Cold night, down to ${Math.round(tmin)}°C`,s:"Move tender pots indoors or cover them tonight."});
  if(settings.profile==="farmer"||settings.profile==="nursery"){
    if(rainTom>=60||tp>=60||wind>=20)out.push({k:"warn",ic:"feed",t:"Not a good day to spray",s:wind>=20?`Wind up to ${Math.round(wind)} km/h will drift the spray.`:"Rain is expected and will wash it off. Wait for a dry day."});
    else out.push({k:"ok",ic:"feed",t:"Good day to spray",s:"Low rain chance and calm wind for the next 24 hours."});
  }
  const hasOut=plants.some(isOutdoor);
  if(!hasOut&&tmax>=34)out.push({k:"warn",ic:"temp",t:`Hot day, up to ${Math.round(tmax)}°C`,s:"Plants near sunny windows dry out faster today. Check the soil with a finger before watering."});
  if(!hasOut&&tmin<=8)out.push({k:"warn",ic:"temp",t:`Cold night, down to ${Math.round(tmin)}°C`,s:"Keep pots away from cold windows and doors tonight."});
  if(wx.h<35&&out.length<2)out.push({k:"ok",ic:"hum",t:`Dry air (${wx.h}% humidity)`,s:"Mist ferns and tropical plants, or group pots together."});
  if(!out.length)out.push({k:"ok",ic:"leaf",t:"Easy weather for plants today",s:"No changes needed. Water as per schedule."});
  return out.slice(0,2);
}

function jStats(p){
  const now=Date.now(),log=p.log||[],in30=log.filter(e=>now-e.t<30*DAY);
  const waters=new Set(in30.filter(e=>e.type==="water"||e.type==="rain").map(e=>new Date(e.t).toDateString())).size;
  const expected=Math.max(1,Math.round(Math.min(30,(now-(log[log.length-1]?.t||now))/DAY)/p.every));
  const feed=log.find(e=>e.type==="feed"),health=log.find(e=>e.type==="health"||(e.type==="added"&&e.status));
  const photos=log.filter(e=>e.photo).length;
  return {waters,expected,pct:Math.min(100,Math.round(waters/expected*100)),feedDays:feed?Math.floor((now-feed.t)/DAY):null,health,photos};
}
function vJStats(p){const st=jStats(p),hk=st.health?.status==="serious"?"bad":st.health?.status==="minor"?"warn":st.health?"ok":"";

}

function groupLog(log){const out=[];for(const e of log){const g=out[out.length-1];

/* ---------- photos ---------- */
async function shrink(file){
  let img=null;try{img=await createImageBitmap(file)}catch(e){img=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=URL.createObjectURL(file)})}
  if(!img)return null;const W=img.width,H=img.height;
  const draw=max=>{const s=Math.min(1,max/Math.max(W,H)),c=document.createElement("canvas");c.width=Math.round(W*s);c.height=Math.round(H*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c};
  const blob=await new Promise(r=>draw(1024).toBlob(r,"image/jpeg",.85));
  return {blob,thumb:draw(640).toDataURL("image/jpeg",.78)};
}
async function smallThumb(blob){try{const img=await createImageBitmap(blob);const s=Math.min(1,280/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.72)}catch(e){return null}}
async function takeFile(f){
  if(!f)return;view="scan";const s=await shrink(f);
  if(!s){scan.error="That file isn't a photo we can read. Try a JPEG or PNG.";render();return}
  if(scan.url)URL.revokeObjectURL(scan.url);
  scan={file:s.blob,thumb:s.thumb,url:URL.createObjectURL(s.blob),busy:false,step:0,result:null,error:null,mode:scan.mode};identify();
}
/* live camera (real browsers only; falls back to the phone's camera app) */
function wantCamera(){return view==="scan"&&!scan.url&&!scan.busy&&!scan.result&&!sheet}
async function syncCamera(){
  if(!wantCamera()){stopCamera();return}
  const v=$("video");
  if(cam.stream){if(v&&v.srcObject!==cam.stream){v.srcObject=cam.stream;v.play().catch(()=>{})}return}
  if(cam.state==="starting"||cam.state==="blocked"||cam.state==="none")return;
  if(!navigator.mediaDevices?.getUserMedia||window.claude){cam.state="fallback";return}
  cam.state="starting";render(true);
  try{
    cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cam.facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(!wantCamera()){stopCamera();return}
    cam.state="live";render(true);
  }catch(e){cam.state=e?.name==="NotAllowedError"?"blocked":e?.name==="NotFoundError"?"none":"fallback";render(true)}
}
function stopCamera(){if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}if(cam.state==="live"||cam.state==="starting")cam.state="idle"}
async function shoot(){
  const v=$("video");if(!v||!v.videoWidth)return;
  const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));stopCamera();takeFile(blob);
}
function quotaToast(r){if(typeof r?._left!=="number")return;scansLeft=r._left;
  if(r._left<=1)setTimeout(()=>toast(r._left===0?(r._member?"That was your last scan today":"Last free scan used. Sign in free for more."):(r._member?"1 scan left today":"1 free scan left today")),900)}

async function identify(){
  scan.busy=true;scan.step=0;scan.error=null;render();
  const t1=setTimeout(()=>{if(scan.busy){scan.step=1;render(true)}},1600),t2=setTimeout(()=>{if(scan.busy){scan.step=2;render(true)}},4500);
  try{
    const mode=scan.mode,r=await aiIdentify(scan.file,mode);track(mode==="health"?"scan_health":"scan_identify");
    if(!r||r.is_plant===false)scan.error="No plant found in that photo. Get closer to the leaves and try again.";
    else if(mode==="health"){r.kind="health";scan.result=r;quotaToast(r)}
    else{quotaToast(r);r.kind="id";r.confidence=Number(r.confidence)||0;r.water_days=Math.max(1,Math.round(Number(r.water_days)||7));scan.result=r}
  }catch(e){scan.error=e.message;track("scan_fail");if(e.signIn){scan.needSignIn=true}}
  clearTimeout(t1);clearTimeout(t2);scan.busy=false;render();
}

/* ---------- accounts + cloud sync ---------- */
let auth={user:null,lib:null,ready:false,syncing:false,lastSync:0,error:"",form:null,providers:null,unavailable:false};
let tomb={};try{tomb=JSON.parse(localStorage.getItem("leafline.deleted")||"{}")}catch(e){}
function saveTomb(){setLS("leafline.deleted",JSON.stringify(tomb))}
async function authLib(){if(auth.lib)return auth.lib;if(window.claude||location.protocol!=="https:")return null;try{auth.lib=await import("/vendor/identity.js")}catch(e){return null}return auth.lib}
function authMsg(e){const m=String(e?.message||e||"");
  if(/invalid.*(grant|login|credentials)|no user found|invalid email or password/i.test(m))return"Wrong email or password.";
  if(/not confirmed|confirm/i.test(m))return"Confirm your email first. Check your inbox.";
  if(/already registered|already exists/i.test(m))return"That email already has an account. Log in instead.";
  if(/password/i.test(m)&&/short|length|least/i.test(m))return"Use a password with at least 8 characters.";
  if(/signup.*disabled/i.test(m))return"New sign-ups are switched off.";
  return m||"Something went wrong. Try again."}
async function authFetch(path,opt={}){const lib=await authLib();await lib?.refreshSession().catch(()=>{});return fetch(path,{credentials:"same-origin",...opt})}
async function initAuth(){
  const lib=await authLib();if(!lib){auth.ready=true;return}
  try{auth.providers=await lib.getSettings()}catch(e){auth.unavailable=true}
  try{const cb=await lib.handleAuthCallback();if(cb){history.replaceState(null,"",location.pathname+location.search);
    if(cb.type==="confirmation")toast("Email confirmed. You're signed in.");if(cb.type==="oauth")track("login")}}catch(e){toast(authMsg(e))}
  auth.user=await lib.getUser().catch(()=>null);auth.ready=true;
  if(auth.user)await syncNow(true);else render(true);
}
async function afterLogin(){const lib=await authLib();auth.user=await lib.getUser();auth.form=null;if(scan.needSignIn){scan.needSignIn=false;scan.error=null}await syncNow();toast("Signed in. Your plants are backed up.")}
function mergePlants(cloud){
  const byId=new Map();const cdel={};
  for(const c of cloud||[]){if(c.deleted){cdel[c.id]=c.updated;continue}byId.set(c.id,{...c,photo:c.hasPhoto?`/api/photo/${c.id}`:null,log:(c.log||[]).map(e=>({...e,photo:e.hasPhoto?`/api/photo/${c.id}-${e.t.toString(36)}`:null,_up:true})),_cloud:true})}
  for(const l of plants){const c=byId.get(l.id),lu=l.updated||l.last||0;
    if(cdel[l.id]&&cdel[l.id]>=lu)continue;
    if(!c||lu>=(c.updated||0)){byId.set(l.id,{...l,photo:l.photo||c?.photo||null,_cloud:!!c,_cloudPhoto:!!c?.hasPhoto})}
    else if(l.photo?.startsWith("data:"))c.photo=l.photo,c._cloudPhoto=c.hasPhoto}
  for(const id of Object.keys(tomb))byId.delete(id);
  for(const [id,t] of Object.entries(cdel))if(!tomb[id])tomb[id]=t;
  return [...byId.values()].sort((a,b)=>(b.updated||b.last)-(a.updated||a.last));
}
async function syncNow(quiet){
  if(!auth.user||auth.syncing)return;auth.syncing=true;auth.error="";if(!quiet&&sheet)render(true);
  try{
    const r=await authFetch("/api/sync");if(r.status===401){auth.user=null;throw new Error("Please sign in again.")}
    const doc=await r.json();
    if(!settings.profile&&doc.profile){settings.profile=doc.profile;setLS("leafline.profile",doc.profile);LOCS=V().places}
    const hadNone=!plants.length;plants=mergePlants(doc.plants);
    try{localStorage.setItem("leafline.plants",JSON.stringify(plants))}catch(e){}
    await uploadPhotos();await pushNow();auth.lastSync=Date.now();
    if(hadNone&&plants.length&&!quiet)toast(`${plants.length} ${plants.length===1?V().item:V().items} restored`);
  }catch(e){auth.error=e.message||"Sync failed. Try again."}
  auth.syncing=false;render(true);syncRemindersSoon();
}
async function uploadPhotos(){
  for(const p of plants){
    if(p.photo?.startsWith("data:")&&!p._cloudPhoto){const up=await authFetch(`/api/photo/${p.id}`,{method:"PUT",headers:{"Content-Type":"image/jpeg"},body:await (await fetch(p.photo)).blob()});if(up.ok)p._cloudPhoto=true}
    for(const e of p.log||[]){if(e.photo?.startsWith("data:")&&!e._up){const up=await authFetch(`/api/photo/${p.id}-${e.t.toString(36)}`,{method:"PUT",headers:{"Content-Type":"image/jpeg"},body:await (await fetch(e.photo)).blob()});if(up.ok)e._up=true}}
  }
}
async function pushNow(){
  if(!auth.user)return;
  const list=plants.map(p=>({...p,photo:undefined,hasPhoto:!!p.photo,log:(p.log||[]).map(e=>({...e,photo:undefined,hasPhoto:!!e.photo}))})).concat(Object.entries(tomb).map(([id,t])=>({id,deleted:true,updated:t,name:"",every:1,last:t})));
  const r=await authFetch("/api/sync",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({plants:list,profile:settings.profile||"home",lang:settings.lang})});
  if(!r.ok)throw new Error("Couldn't back up. Check your internet.");
}
let pushT;function pushSoon(){if(!auth.user||auth.syncing)return;clearTimeout(pushT);pushT=setTimeout(async()=>{
  try{await uploadPhotos();await pushNow();auth.lastSync=Date.now();auth.error=""}catch(e){auth.error=e.message}},1500)}

/* ---------- reminders (web push) ---------- */
function b64ToU8(b){const p="=".repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function enableReminders(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){
    toast(/iphone|ipad/i.test(navigator.userAgent)?"Add Leafline to your Home Screen first, then try again":"This browser can't send reminders. Use Add to calendar instead.");return}
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){toast("Notifications are blocked. Allow them in browser settings.");return}
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID)});
    await postReminders(sub);settings.reminders=true;setLS("leafline.reminders","on");track("reminders_on");
    render(true);toast("Reminders on. We'll ping you at 9 AM.");
  }catch(e){toast("Couldn't turn on reminders. Try again.")}
}
async function disableReminders(){
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe();
    await fetch("/api/reminders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({deviceId:settings.device,subscription:null})})}catch(e){}
  settings.reminders=false;setLS("leafline.reminders","");track("reminders_off");render(true);toast("Reminders off");
}
async function postReminders(sub){
  await fetch("/api/reminders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({deviceId:settings.device,subscription:sub.toJSON(),lang:settings.lang,
    hour:settings.remindHour??9,plants:plants.map(p=>({id:p.id,name:p.name,next:p.last+p.every*DAY,nextFeed:feedEvery(p)?lastFeed(p)+feedEvery(p)*DAY:0}))})});
}
let syncT;function syncRemindersSoon(){if(!settings.reminders||!("serviceWorker" in navigator))return;clearTimeout(syncT);syncT=setTimeout(async()=>{try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub)await postReminders(sub)}catch(e){}},800)}

/* ---------- calendar (.ics) ---------- */
function addToCalendar(p){
  if(!p)return;const d=new Date(p.last+p.every*DAY);d.setHours(9,0,0,0);const pad=n=>String(n).padStart(2,"0");
  const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const e=new Date(d.getTime()+15*60000);
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Leafline//EN","BEGIN:VEVENT",`UID:${p.id}@leafline`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(d)}`,`DTEND:${f(e)}`,
    `RRULE:FREQ=DAILY;INTERVAL=${p.every}`,`SUMMARY:Water ${p.name.replace(/[,;\\]/g," ")}`,`DESCRIPTION:Leafline reminder. Open https://leaf-line.netlify.app`,"BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Water your plant","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const url=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));const a=document.createElement("a");a.href=url;a.download=`water-${p.name.replace(/\W+/g,"-").toLowerCase()}.ics`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);track("calendar");toast("Open the downloaded file to add it to your calendar");
}

async function shareCard({photo,name,sci,water,light}){
  toast("Making your card…");
  try{
    await document.fonts?.ready;
    const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
    x.fillStyle="#13201A";x.fillRect(0,0,W,H);
    if(photo){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=photo});
      const ph=860,s=Math.max(W/img.width,ph/img.height),w=img.width*s,h=img.height*s;
      x.save();x.beginPath();x.roundRect(40,40,W-80,ph-40,48);x.clip();x.drawImage(img,(W-w)/2,40+(ph-40-h)/2,w,h);x.restore();}
    const tag=(t,X,Y,bg,fg)=>{x.font="800 34px Manrope, sans-serif";const tw=x.measureText(t).width+56;x.fillStyle=bg;x.beginPath();x.roundRect(X,Y,tw,72,36);x.fill();x.fillStyle=fg;x.fillText(t,X+28,Y+47);return tw};
    x.fillStyle="#FFFFFF";x.font="800 88px 'Bricolage Grotesque', Georgia, serif";x.fillText(name.slice(0,22),64,1000);
    x.fillStyle="#A9B8AE";x.font="italic 500 40px Manrope, sans-serif";x.fillText((sci||"").slice(0,40),66,1056);
    let X=64;if(water)X+=tag(`Water every ${water} days`,X,1100,"#F4C95D","#13201A")+16;if(light)tag(String(light).slice(0,22),X,1100,"#EEF2EC","#13201A");
    x.fillStyle="#5CC08F";x.font="800 38px 'Bricolage Grotesque', sans-serif";x.fillText("Leafline",64,1280);
    x.fillStyle="#A9B8AE";x.font="600 32px Manrope, sans-serif";x.fillText("Identified free at leaf-line.netlify.app",270,1280);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));const file=new File([blob],`${name.replace(/\W+/g,"-")}-leafline.jpg`,{type:"image/jpeg"});
    track("share");
    if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],text:`I just identified my ${name} with Leafline 🌿 Try it free: https://leaf-line.netlify.app`});return}
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();toast("Card saved to your downloads");
  }catch(e){if(e?.name!=="AbortError")toast("Couldn't make the card. Try again.")}
}

function bindSheet(){
  const close=()=>{sheet=null;render(true)};
  $("scrim").onclick=close;
  const chips=$("roomchips"),ri=$("roominput");
  chips.onclick=e=>{const c=e.target.closest("[data-room]");if(!c)return;sheet.loc=c.dataset.room;ri.hidden=true;ri.value="";chips.querySelectorAll("[data-room]").forEach(x=>x.setAttribute("aria-pressed",String(x===c)))};
  $("newroom").onclick=()=>{ri.hidden=false;ri.focus();chips.querySelectorAll("[data-room]").forEach(x=>x.setAttribute("aria-pressed","false"))};
  $("sheetsave").onclick=()=>{
    const name=$("nick").value.trim()||sheet.name, loc=(!ri.hidden&&ri.value.trim())||sheet.loc;
    if(sheet.kind==="add"){const r=scan.result;
      const p={id:"p"+Date.now(),name,sci:r.scientific,loc,every:r.water_days,last:Date.now(),updated:Date.now(),photo:scan.thumb,log:[{t:Date.now(),type:"added",text:r.health?.headline||"",status:r.health?.status}],
        care:{light:r.light,humidity:r.humidity,temp:r.temperature,soil:r.soil,fertilizer:r.fertilizer,toxic:r.toxicity,difficulty:r.difficulty,tips:r.tips||[]}};
      plants.unshift(p);save();track("save_plant");resetScan();sheet=null;current=p.id;view="detail";render();toast(auth.user||window.claude?`${name} added to ${loc}`:`${name} saved on this phone. Sign in to back it up.`)}
    else{const p=plants.find(x=>x.id===sheet.id);p.name=name;p.loc=loc;p.updated=Date.now();save();sheet=null;render(true);toast("Saved")}
  };
  document.onkeydown=e=>{if(e.key==="Escape"&&sheet)close()};
}
async function ask(p){
  const q=$("q").value.trim();if(!q)return;const out=$("ans");out.hidden=false;out.textContent="Thinking…";
  const ctx=`Plant: ${p.name} (${p.sci||""}). Location: ${p.loc}. Watered every ${p.every} days, last watered ${ago(p.last).toLowerCase()}. Known care: ${JSON.stringify(p.care||{})}`;
  track("ask");try{await aiAsk(ctx,q,t=>{out.textContent=t})}catch(e){out.textContent=e.message}
}
document.addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/"));if(f)takeFile(f)});

if(new URLSearchParams(location.search).get("view")==="schedule"){view="schedule";history.replaceState(null,"","/")}
const deep=new URLSearchParams(location.search).get("plant");if(deep&&plants.some(p=>p.id===deep)){current=deep;view="detail";history.replaceState(null,"","/")}
document.documentElement.lang=settings.lang;
render();track("open");initAuth();loadWeather();
if("serviceWorker" in navigator && !window.claude && location.protocol==="https:") navigator.serviceWorker.register("/sw.js").then(r=>r.update()).catch(()=>{});
{let reloaded=false;navigator.serviceWorker?.addEventListener("controllerchange",()=>{if(!reloaded&&!scan.busy&&!sheet&&view!=="scan"){reloaded=true;location.reload()}})}
</script>
</body>
